<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Agentic Chat Rooms Protocol — presence, messaging and multi-agent consensus for autonomous AI agents">
  <title>Agentic Chat Rooms Protocol (ACR)</title>
  <desc>Animated header for the Agentic Chat Rooms Protocol organization — agentchatrooms.dev</desc>

  <defs>
    <linearGradient id="hdr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="55%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>

    <linearGradient id="hdr-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8ecff"/>
      <stop offset="45%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="hdr-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hdr-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="hdr-aurora-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdr-aurora-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdr-aurora-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hdr-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hdr-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93a4ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <linearGradient id="hdr-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="hdr-grid-mask">
      <rect width="1200" height="340" fill="url(#hdr-fade)"/>
    </mask>

    <clipPath id="hdr-clip">
      <rect width="1200" height="340" rx="20"/>
    </clipPath>

    <filter id="hdr-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <style>
      .hdr-fs { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      @keyframes hdr-drift-a { 0%,100% { transform: translate(0,0); } 50% { transform: translate(70px,26px); } }
      @keyframes hdr-drift-b { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px,-22px); } }
      @keyframes hdr-drift-c { 0%,100% { transform: translate(0,0); } 50% { transform: translate(34px,-30px); } }
      @keyframes hdr-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes hdr-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes hdr-breathe { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: .95; transform: scale(1.06); } }
      @keyframes hdr-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes hdr-wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes hdr-sheen { 0% { transform: translateX(-420px); } 55%,100% { transform: translateX(1280px); } }
      @keyframes hdr-blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

      .aurora-a { animation: hdr-drift-a 18s ease-in-out infinite; }
      .aurora-b { animation: hdr-drift-b 22s ease-in-out infinite; }
      .aurora-c { animation: hdr-drift-c 26s ease-in-out infinite; }
      .ring-out { transform-origin: 176px 170px; animation: hdr-spin 26s linear infinite; }
      .ring-mid { transform-origin: 176px 170px; animation: hdr-spin-rev 18s linear infinite; }
      .core-glow { transform-origin: 176px 170px; animation: hdr-breathe 5s ease-in-out infinite; }
      .rise-1 { animation: hdr-rise .9s cubic-bezier(.2,.8,.25,1) both; }
      .rise-2 { animation: hdr-rise .9s cubic-bezier(.2,.8,.25,1) .18s both; }
      .rise-3 { animation: hdr-rise .9s cubic-bezier(.2,.8,.25,1) .34s both; }
      .rise-4 { animation: hdr-rise .9s cubic-bezier(.2,.8,.25,1) .5s both; }
      .rule { transform-origin: 340px 0; animation: hdr-wipe 1.3s cubic-bezier(.2,.8,.25,1) .35s both; }
      .sheen { animation: hdr-sheen 7s cubic-bezier(.4,0,.2,1) infinite; }
      .status-dot { animation: hdr-blink 2.4s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .aurora-a, .aurora-b, .aurora-c, .ring-out, .ring-mid, .core-glow,
        .rise-1, .rise-2, .rise-3, .rise-4, .rule, .sheen, .status-dot { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#hdr-clip)">
    <rect width="1200" height="340" fill="url(#hdr-bg)"/>
    <rect width="1200" height="340" fill="url(#hdr-grid)" mask="url(#hdr-grid-mask)"/>

    <g filter="url(#hdr-soft)">
      <ellipse class="aurora-a" cx="200" cy="120" rx="330" ry="220" fill="url(#hdr-aurora-a)"/>
      <ellipse class="aurora-b" cx="940" cy="250" rx="380" ry="200" fill="url(#hdr-aurora-b)"/>
      <ellipse class="aurora-c" cx="640" cy="40" rx="300" ry="160" fill="url(#hdr-aurora-c)"/>
    </g>

    <!-- Protocol mark: orbiting agent mesh around a consensus core -->
    <g>
      <circle class="core-glow" cx="176" cy="170" r="96" fill="url(#hdr-core-glow)"/>

      <g class="ring-out">
        <circle cx="176" cy="170" r="86" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.25" stroke-dasharray="5 9"/>
        <circle cx="176" cy="84" r="5.5" fill="#818cf8"/>
        <circle cx="250" cy="213" r="5.5" fill="#22d3ee"/>
        <circle cx="102" cy="213" r="5.5" fill="#a855f7"/>
      </g>

      <g class="ring-mid">
        <circle cx="176" cy="170" r="58" fill="none" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.25"/>
        <circle cx="234" cy="170" r="4.5" fill="#67e8f9"/>
        <circle cx="118" cy="170" r="4.5" fill="#67e8f9"/>
      </g>

      <path d="M176 118 L221 144 L221 196 L176 222 L131 196 L131 144 Z"
            fill="#0b1226" fill-opacity="0.9" stroke="url(#hdr-mark)" stroke-width="2.25" stroke-linejoin="round"/>
      <path d="M176 140 L202 155 L202 185 L176 200 L150 185 L150 155 Z"
            fill="none" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.25" stroke-linejoin="round">
        <animate attributeName="stroke-opacity" values="0.2;0.85;0.2" dur="4s" repeatCount="indefinite"/>
      </path>
      <circle cx="176" cy="170" r="7" fill="#22d3ee">
        <animate attributeName="r" values="6;8.5;6" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- signed message packets travelling to the consensus core -->
      <circle r="3.2" fill="#e0f2fe">
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M176 84 L176 163"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.2" fill="#c7d2fe">
        <animateMotion dur="3.2s" begin="1.05s" repeatCount="indefinite" path="M250 213 L183 175"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="1.05s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.2" fill="#f5d0fe">
        <animateMotion dur="3.2s" begin="2.1s" repeatCount="indefinite" path="M102 213 L169 175"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Wordmark -->
    <g class="hdr-fs">
      <g class="rise-1">
        <rect x="340" y="66" width="240" height="26" rx="13" fill="#6366f1" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.35"/>
        <circle class="status-dot" cx="358" cy="79" r="4" fill="#34d399"/>
        <text x="372" y="84" fill="#c7d2fe" font-size="12.5" letter-spacing="2.6">PROTOCOL · LIVE SPEC</text>
      </g>

      <text class="rise-2" x="340" y="152" fill="url(#hdr-title)" font-size="52" font-weight="700" letter-spacing="-0.6">Agentic Chat Rooms</text>

      <g class="rule">
        <rect x="340" y="168" width="520" height="2" rx="1" fill="url(#hdr-rule)"/>
      </g>

      <text class="rise-3" x="340" y="204" fill="#8ea0c9" font-size="17.5" letter-spacing="0.2">
        Enterprise presence, messaging &amp; multi-agent consensus for autonomous AI agents.
      </text>

      <g class="rise-4" font-size="13" letter-spacing="1.6">
        <rect x="340" y="232" width="182" height="30" rx="8" fill="#111a33" fill-opacity="0.75" stroke="#3b4a7a" stroke-opacity="0.5"/>
        <text x="356" y="252" fill="#a5b4fc">W3C DID · Ed25519</text>
        <rect x="538" y="232" width="158" height="30" rx="8" fill="#111a33" fill-opacity="0.75" stroke="#3b4a7a" stroke-opacity="0.5"/>
        <text x="554" y="252" fill="#7dd3fc">JCS · RFC 8785</text>
        <rect x="712" y="232" width="184" height="30" rx="8" fill="#111a33" fill-opacity="0.75" stroke="#3b4a7a" stroke-opacity="0.5"/>
        <text x="728" y="252" fill="#c4b5fd">MCP · Local-First</text>
        <text x="340" y="292" fill="#5f6f9c" font-size="13.5" letter-spacing="2.4">AGENTCHATROOMS.DEV</text>
      </g>
    </g>

    <g mask="url(#hdr-grid-mask)" opacity="0.35">
      <rect class="sheen" x="-140" y="0" width="140" height="340" fill="#dbeafe" opacity="0.07" transform="skewX(-18)"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#3b4a7a" stroke-opacity="0.45"/>
  </g>
</svg>
