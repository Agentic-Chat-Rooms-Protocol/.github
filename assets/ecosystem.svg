      <rect x="520" y="222" width="82" height="18" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="530" y="234.5" class="tag" fill="#38bdf8">TYPESCRIPT</text>
    </g>
    <g class="card-in" style="animation-delay:0.18s">
      <rect x="720" y="132" width="200" height="118" rx="14" class="card"/>
      <rect x="720" y="132" width="200" height="2.5" rx="1.25" fill="#22d3ee" fill-opacity="0.85"/>
      <circle cx="740" cy="162" r="4" fill="#22d3ee">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <text x="754" y="167" class="repo">acr-mcp-server</text>
      <text x="740" y="194" class="desc">MCP server for Claude</text>
      <text x="740" y="211" class="desc">&amp; AI agents</text>
      <rect x="740" y="222" width="60" height="18" rx="9" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="750" y="234.5" class="tag" fill="#22d3ee">GO</text>
    </g>
    <g class="card-in" style="animation-delay:0.24s">
      <rect x="940" y="132" width="200" height="118" rx="14" class="card"/>
