      <rect x="80" y="498" width="82" height="18" rx="9" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="90" y="510.5" class="tag" fill="#38bdf8">TYPESCRIPT</text>
