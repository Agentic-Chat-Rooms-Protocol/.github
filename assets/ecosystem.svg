      <circle cx="740" cy="300" r="4" fill="#5eead4">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <text x="754" y="305" class="repo">acr-cli</text>
      <text x="740" y="332" class="desc">Cross-platform CLI &amp;</text>
      <text x="740" y="349" class="desc">dev tooling</text>
      <rect x="740" y="360" width="60" height="18" rx="9" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.35"/>
      <text x="750" y="372.5" class="tag" fill="#5eead4">DART</text>
