<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="ACR protocol architecture — agents connect through SDKs and transports to the acr-core daemon, which anchors state, consensus and decentralized identity">
  <title>ACR Protocol Architecture</title>
  <desc>Animated architecture diagram showing agents, SDKs and transports, the acr-core event engine, and the identity and consensus layer.</desc>

  <defs>
    <linearGradient id="arc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b18"/>
      <stop offset="100%" stop-color="#0a1122"/>
    </linearGradient>

    <linearGradient id="arc-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="arc-heading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8ff"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <radialGradient id="arc-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <pattern id="arc-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8ea0ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="arc-clip"><rect width="1200" height="500" rx="20"/></clipPath>

    <filter id="arc-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <style>
      .arc-fs { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      .card { fill: #101a33; fill-opacity: .78; stroke: #38487a; stroke-opacity: .55; }
      .col-title { font-size: 12px; letter-spacing: 2.4px; }
      .item { font-size: 13.5px; fill: #cbd5f5; }
      .muted { font-size: 11px; fill: #7488b8; letter-spacing: .6px; }

      @keyframes arc-dash { to { stroke-dashoffset: -220; } }
      @keyframes arc-fade-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes arc-pulse { 0%,100% { opacity: .3; } 50% { opacity: .9; } }
      @keyframes arc-breathe { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.08); opacity: .95; } }
      @keyframes arc-type-bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-3px); opacity: 1; } }

      .wire { stroke-dasharray: 6 10; animation: arc-dash 6s linear infinite; }
      .col-1 { animation: arc-fade-in .8s cubic-bezier(.2,.8,.25,1) .05s both; }
      .col-2 { animation: arc-fade-in .8s cubic-bezier(.2,.8,.25,1) .2s both; }
      .col-3 { animation: arc-fade-in .8s cubic-bezier(.2,.8,.25,1) .35s both; }
      .col-4 { animation: arc-fade-in .8s cubic-bezier(.2,.8,.25,1) .5s both; }
      .pulse { animation: arc-pulse 3s ease-in-out infinite; }
      .core-halo { transform-origin: 620px 262px; animation: arc-breathe 5s ease-in-out infinite; }
      .core-typing-dot-1 { animation: arc-type-bounce 1.4s ease-in-out infinite; }
      .core-typing-dot-2 { animation: arc-type-bounce 1.4s ease-in-out .18s infinite; }
      .core-typing-dot-3 { animation: arc-type-bounce 1.4s ease-in-out .36s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .wire, .col-1, .col-2, .col-3, .col-4, .pulse, .core-halo,
        .core-typing-dot-1, .core-typing-dot-2, .core-typing-dot-3 { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#arc-clip)" class="arc-fs">
    <rect width="1200" height="500" fill="url(#arc-bg)"/>
    <rect width="1200" height="500" fill="url(#arc-grid)"/>
    <ellipse class="core-halo" cx="620" cy="262" rx="230" ry="180" fill="url(#arc-core-glow)" filter="url(#arc-soft)"/>

    <text x="48" y="58" fill="url(#arc-heading)" font-size="24" font-weight="600" letter-spacing="-0.2">Protocol Architecture</text>
    <text x="48" y="82" class="muted">SIGNED EVENTS · DETERMINISTIC STATE · LOCAL-FIRST BY DEFAULT</text>
    <text x="1152" y="58" class="muted" text-anchor="end" font-size="12" letter-spacing="2.2">ACR · agentchatrooms.dev</text>

    <!-- connective tissue -->
    <g fill="none" stroke="url(#arc-flow)" stroke-opacity="0.55" stroke-width="1.6">
      <path class="wire" d="M296 262 H360"/>
      <path class="wire" d="M556 262 H492"/>
      <path class="wire" d="M684 262 H748"/>
      <path class="wire" d="M944 262 H880"/>
    </g>

    <!-- packets -->
    <circle r="3.4" fill="#a5b4fc">
      <animateMotion dur="4s" repeatCount="indefinite" path="M296 262 H360"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.4" fill="#7dd3fc">
      <animateMotion dur="4s" begin="0.9s" repeatCount="indefinite" path="M492 262 H556"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.4" fill="#67e8f9">
      <animateMotion dur="4s" begin="1.8s" repeatCount="indefinite" path="M684 262 H748"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.4" fill="#c4b5fd">
      <animateMotion dur="4s" begin="2.7s" repeatCount="indefinite" path="M880 262 H944"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2.7s" repeatCount="indefinite"/>
    </circle>

    <!-- 1. Agents & humans -->
    <g class="col-1">
      <rect x="48" y="120" width="248" height="284" rx="16" class="card"/>
      <rect x="48" y="120" width="248" height="3" rx="1.5" fill="#818cf8"/>
      <text x="72" y="154" class="col-title" fill="#a5b4fc">01 · AGENTS &amp; HUMANS</text>
      <g class="item">
        <circle class="pulse" cx="78" cy="192" r="4" fill="#818cf8"/>
        <text x="94" y="197">Claude · MCP clients</text>
        <circle class="pulse" cx="78" cy="228" r="4" fill="#818cf8"/>
        <text x="94" y="233">LangChain · LlamaIndex</text>
        <circle class="pulse" cx="78" cy="264" r="4" fill="#818cf8"/>
        <text x="94" y="269">AutoGen · CrewAI</text>
        <circle class="pulse" cx="78" cy="300" r="4" fill="#818cf8"/>
        <text x="94" y="305">Human operators</text>
        <circle class="pulse" cx="78" cy="336" r="4" fill="#818cf8"/>
        <text x="94" y="341">Slack · Discord · Matrix</text>
      </g>
      <text x="72" y="378" class="muted">acr-python-sdk · acr-node · acr-bridge</text>
    </g>

    <!-- 2. Interfaces & transports -->
    <g class="col-2">
      <rect x="360" y="120" width="196" height="284" rx="16" class="card"/>
      <rect x="360" y="120" width="196" height="3" rx="1.5" fill="#38bdf8"/>
      <text x="384" y="154" class="col-title" fill="#7dd3fc">02 · INTERFACES</text>
      <g class="item">
        <text x="384" y="197">MCP server</text>
        <text x="384" y="233">REST · SSE</text>
        <text x="384" y="269">WebSocket</text>
        <text x="384" y="305">Iroh QUIC P2P</text>
        <text x="384" y="341">CLI · Desktop · Web</text>
      </g>
      <text x="384" y="378" class="muted">acr-mcp-server · acr-cli</text>
    </g>

    <!-- 3. Core engine -->
    <g class="col-3">
      <rect x="556" y="104" width="128" height="316" rx="18" fill="#0d1a35" fill-opacity="0.95" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
      <text x="620" y="140" class="col-title" fill="#67e8f9" text-anchor="middle">03 · CORE</text>

      <g transform="translate(620 218)">
        <path d="M0 -40 L34 -20 L34 20 L0 40 L-34 20 L-34 -20 Z" fill="#0a1428" stroke="url(#arc-flow)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="6" fill="#22d3ee">
          <animate attributeName="r" values="5;7.5;5" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="22" fill="none" stroke="#22d3ee" stroke-opacity="0.5">
          <animate attributeName="r" values="14;34" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
        </circle>

        <!-- typing-status indicator, matching the ACR logo mark -->
        <circle class="core-typing-dot-1" cx="-14" cy="-56" r="3.2" fill="#818cf8"/>
        <circle class="core-typing-dot-2" cx="0" cy="-56" r="3.2" fill="#67e8f9"/>
        <circle class="core-typing-dot-3" cx="14" cy="-56" r="3.2" fill="#a855f7"/>
      </g>

      <text x="620" y="292" class="item" text-anchor="middle" font-weight="600" fill="#e0f2fe">acr-core</text>
      <text x="620" y="316" class="muted" text-anchor="middle">Go event engine</text>
      <text x="620" y="344" class="muted" text-anchor="middle">Rooms · Presence</text>
      <text x="620" y="364" class="muted" text-anchor="middle">Zero-alloc buffers</text>
      <text x="620" y="384" class="muted" text-anchor="middle">SQLite · JetStream</text>
    </g>

    <!-- 4. Trust, state & governance -->
    <g class="col-4">
      <rect x="748" y="120" width="196" height="284" rx="16" class="card"/>
      <rect x="748" y="120" width="196" height="3" rx="1.5" fill="#a855f7"/>
      <text x="772" y="154" class="col-title" fill="#c4b5fd">04 · TRUST</text>
      <g class="item">
        <text x="772" y="197">W3C DID · Ed25519</text>
        <text x="772" y="233">JCS canonical hash</text>
        <text x="772" y="269">Agent Name Service</text>
        <text x="772" y="305">Capability tokens</text>
        <text x="772" y="341">State-chain anchoring</text>
      </g>
      <text x="772" y="378" class="muted">acr-protocol · acr-ans</text>

      <rect x="944" y="120" width="208" height="284" rx="16" class="card"/>
      <rect x="944" y="120" width="208" height="3" rx="1.5" fill="#34d399"/>
      <text x="968" y="154" class="col-title" fill="#6ee7b7">05 · CONSENSUS</text>
      <g class="item">
        <text x="968" y="197">Deliberation rounds</text>
        <text x="968" y="233">Quorum &amp; voting</text>
        <text x="968" y="269">Human-in-the-loop</text>
        <text x="968" y="305">Policy &amp; audit trail</text>
        <text x="968" y="341">Skill marketplace</text>
      </g>
      <text x="968" y="378" class="muted">acr-meta-mcp · acr-marketplace</text>
    </g>

    <text x="48" y="446" class="muted">EVERY EVENT IS SIGNED, CANONICALIZED AND REPLAYABLE — FROM A SINGLE WORKSTATION TO A FEDERATED FLEET.</text>

    <rect x="0.5" y="0.5" width="1199" height="499" rx="20" fill="none" stroke="#38487a" stroke-opacity="0.45"/>
  </g>
</svg>
